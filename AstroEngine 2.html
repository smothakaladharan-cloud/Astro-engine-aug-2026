<style>
  html,body{margin:0;padding:0;background:#1B1F36;-webkit-text-size-adjust:100%;}

<div id="root"></div>

/* The app persists your saved charts through window.storage, which only exists inside the Claude
   artifact viewer. Standing it on localStorage keeps your profiles on this phone between sessions —
   they live in this browser only, and are never sent anywhere. */
(function () {
  if (window.storage) return;
  var K = "astroEngine:";
  window.storage = {
    get: function (k) {
      try { var v = localStorage.getItem(K + k); return Promise.resolve(v === null ? null : { key: k, value: v }); }
      catch (e) { return Promise.resolve(null); }
    },
    set: function (k, v) {
      try { localStorage.setItem(K + k, v); return Promise.resolve({ key: k, value: v }); }
      catch (e) { return Promise.resolve(null); }
    },
    delete: function (k) {
      try { localStorage.removeItem(K + k); return Promise.resolve({ key: k, deleted: true }); }
      catch (e) { return Promise.resolve(null); }
    },
    list: function () { return Promise.resolve({ keys: [] }); }
  };
})();
</script>
